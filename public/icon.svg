<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Apple Royal Blue Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E8BFF"/>
      <stop offset="35%" stop-color="#0071E3"/>
      <stop offset="75%" stop-color="#005ec4"/>
      <stop offset="100%" stop-color="#004ca8"/>
    </linearGradient>

    <!-- Glass Specular Highlight Gradient -->
    <linearGradient id="glassGloss" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Inner Border Chamfer -->
    <linearGradient id="innerStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#003577" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Core Nucleus Radial Aura -->
    <radialGradient id="coreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#BEE0FF" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0071E3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>

    <!-- Orbit Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep Ambient Glow -->
    <filter id="ambientCoreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Full Base Fill (Ensures maskable icons have no transparent corners) -->
  <rect width="512" height="512" fill="url(#bgGradient)"/>

  <!-- 2. Apple iOS Squircle Body -->
  <rect width="512" height="512" rx="116" fill="url(#bgGradient)"/>

  <!-- 3. Glass Specular Curve / Top Rim Reflection -->
  <path d="M 0 116 C 0 50, 50 0, 116 0 L 396 0 C 462 0, 512 50, 512 116 C 512 160, 410 180, 256 180 C 102 180, 0 160, 0 116 Z" fill="url(#glassGloss)" opacity="0.6"/>

  <!-- 4. Subtle Inner Chamfer / Precision Bevel Border -->
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="url(#innerStroke)" stroke-width="4"/>

  <!-- 5. Core Radiant Energy Glow (Backdrop for Atomic Logo) -->
  <circle cx="256" cy="256" r="140" fill="url(#coreAura)" opacity="0.4" filter="url(#ambientCoreGlow)"/>

  <!-- 6. ATOMIC ORBIT 1: Tilted -30 Degrees -->
  <!-- Glow Pass -->
  <ellipse cx="256" cy="256" rx="172" ry="72" fill="none" stroke="#60A5FA" stroke-width="26" opacity="0.45" transform="rotate(-30 256 256)" filter="url(#softGlow)"/>
  <!-- Crisp Solid White Pass -->
  <ellipse cx="256" cy="256" rx="172" ry="72" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-30 256 256)"/>

  <!-- 7. ATOMIC ORBIT 2: Tilted +30 Degrees -->
  <!-- Glow Pass -->
  <ellipse cx="256" cy="256" rx="172" ry="72" fill="none" stroke="#60A5FA" stroke-width="26" opacity="0.45" transform="rotate(30 256 256)" filter="url(#softGlow)"/>
  <!-- Crisp Solid White Pass -->
  <ellipse cx="256" cy="256" rx="172" ry="72" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" transform="rotate(30 256 256)"/>

  <!-- 8. Luminous Orbital Particle Nodes (Energy Electrons) -->
  <!-- Node on Orbit 1 (Top-Right) -->
  <g transform="rotate(-30 256 256)">
    <circle cx="428" cy="256" r="16" fill="#38BDF8" opacity="0.6" filter="url(#softGlow)"/>
    <circle cx="428" cy="256" r="11" fill="#FFFFFF"/>
    <circle cx="428" cy="256" r="6" fill="#0071E3"/>
  </g>

  <!-- Node on Orbit 2 (Bottom-Left) -->
  <g transform="rotate(30 256 256)">
    <circle cx="84" cy="256" r="16" fill="#38BDF8" opacity="0.6" filter="url(#softGlow)"/>
    <circle cx="84" cy="256" r="11" fill="#FFFFFF"/>
    <circle cx="84" cy="256" r="6" fill="#0071E3"/>
  </g>

  <!-- 9. Central Atomic Nucleus (Brilliant Core) -->
  <!-- Deep Blue Core Shadow -->
  <circle cx="256" cy="256" r="38" fill="#0051A8" opacity="0.6" filter="url(#softGlow)"/>
  <!-- Outer Nucleus Ring -->
  <circle cx="256" cy="256" r="32" fill="#BAE6FD" opacity="0.8"/>
  <!-- Pure White Glowing Core -->
  <circle cx="256" cy="256" r="26" fill="#FFFFFF" filter="url(#softGlow)"/>
  <!-- Center Core Pinpoint -->
  <circle cx="256" cy="256" r="12" fill="#FFFFFF"/>
</svg>
