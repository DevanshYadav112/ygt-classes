<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Atomic Orbit Gradients -->
    <linearGradient id="orbit1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="orbit2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="orbit3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Central Shield / Badge Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="url(#coreGrad)" stroke-width="4" opacity="0.3" />

  <!-- Outer Orbit Rings (Science Theme) -->
  <g transform="translate(256, 230)">
    <!-- Orbit 1 (Tilted -45deg) -->
    <ellipse cx="0" cy="0" rx="190" ry="70" fill="none" stroke="url(#orbit1Grad)" stroke-width="6" opacity="0.85" transform="rotate(-35)" />
    <!-- Electron 1 -->
    <circle cx="160" cy="-60" r="12" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="160" cy="-60" r="6" fill="#ffffff" />

    <!-- Orbit 2 (Tilted +45deg) -->
    <ellipse cx="0" cy="0" rx="190" ry="70" fill="none" stroke="url(#orbit2Grad)" stroke-width="6" opacity="0.85" transform="rotate(35)" />
    <!-- Electron 2 -->
    <circle cx="-150" cy="-70" r="12" fill="#ec4899" filter="url(#glow)" />
    <circle cx="-150" cy="-70" r="6" fill="#ffffff" />

    <!-- Orbit 3 (Horizontal) -->
    <ellipse cx="0" cy="0" rx="200" ry="72" fill="none" stroke="url(#orbit3Grad)" stroke-width="5" opacity="0.6" />
    <!-- Electron 3 -->
    <circle cx="195" cy="5" r="10" fill="#10b981" filter="url(#glow)" />
    <circle cx="195" cy="5" r="5" fill="#ffffff" />

    <!-- Sparkling Stars / Science energy sparks -->
    <path d="M -160 110 L -155 125 L -140 130 L -155 135 L -160 150 L -165 135 L -180 130 L -165 125 Z" fill="url(#goldGrad)" />
    <path d="M 140 -130 L 144 -118 L 156 -114 L 144 -110 L 140 -98 L 136 -110 L 124 -114 L 136 -118 Z" fill="#06b6d4" />
  </g>

  <!-- Central Modern Badge: Beaker + Book Motif with "YGT" -->
  <!-- Glowing backdrop aura -->
  <circle cx="256" cy="225" r="95" fill="url(#coreGrad)" opacity="0.25" filter="url(#heavyGlow)" />
  <circle cx="256" cy="225" r="75" fill="#1e1b4b" stroke="url(#coreGrad)" stroke-width="6" />

  <!-- Graduation Mortarboard / Science Cap atop Badge -->
  <path d="M 256 142 L 325 174 L 256 202 L 187 174 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <path d="M 256 188 L 305 208 L 305 220 Q 256 238 207 220 L 207 208 Z" fill="#b45309" opacity="0.8" />
  <path d="M 320 178 L 332 208 L 330 228" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <circle cx="330" cy="230" r="4" fill="#fbbf24" />

  <!-- Center "YGT" Letters in crisp bold modern type -->
  <text x="256" y="278" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="2">YGT</text>

  <!-- Bottom Banner Ribbon: "CLASSES" -->
  <g transform="translate(256, 410)">
    <rect x="-140" y="-36" width="280" height="56" rx="28" fill="url(#coreGrad)" filter="url(#glow)" />
    <rect x="-136" y="-32" width="272" height="48" rx="24" fill="#0b1120" />
    <text x="0" y="3" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">CLASSES</text>
  </g>
</svg>
